<!doctype html>
<html lang="pt-BR" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ATENÇÃO: trocar https://fincontrol.pages.dev pelo domínio real após o
         primeiro deploy (canonical, og:url e og:image dependem disso). -->
    <title>FinControl — Suas finanças sob controle</title>
    <meta
      name="description"
      content="Controle de finanças pessoais com metas e módulo fiscal brasileiro: transações, recorrências, DAS do MEI e limites do Simples."
    />
    <link rel="canonical" href="https://fincontrol.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinControl" />
    <meta property="og:title" content="FinControl — Suas finanças sob controle" />
    <meta
      property="og:description"
      content="Controle de finanças pessoais com metas e módulo fiscal brasileiro: transações, recorrências, DAS do MEI e limites do Simples."
    />
    <meta property="og:url" content="https://fincontrol.pages.dev/" />
    <meta property="og:image" content="https://fincontrol.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FinControl — Suas finanças sob controle" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinControl — Suas finanças sob controle" />
    <meta
      name="twitter:description"
      content="Controle de finanças pessoais com metas e módulo fiscal brasileiro: transações, recorrências, DAS do MEI e limites do Simples."
    />
    <meta name="twitter:image" content="https://fincontrol.pages.dev/og-image.png" />

    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <script>
      /* Aplica o tema salvo antes do primeiro paint — sem isso, o app pisca
         claro antes do Angular subir. Mesma chave usada pelo ServicoTema. */
      (function () {
        try {
          var salvo = localStorage.getItem('fincontrol.tema');
          var escuro = salvo
            ? salvo === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var raiz = document.documentElement;
          raiz.classList.remove('theme-light', 'theme-dark');
          raiz.classList.add(escuro ? 'theme-dark' : 'theme-light');
          raiz.style.colorScheme = escuro ? 'dark' : 'light';
        } catch (erro) {
          /* localStorage bloqueado: segue com o tema claro do atributo class */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
